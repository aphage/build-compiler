name: Build Cross Toolchain

on:
  workflow_dispatch:
    inputs:
      combo:
        description: Supported libc and C++ runtime combination
        required: true
        default: glibc-libstdcxx
        type: choice
        options:
          - glibc-libstdcxx
          - glibc-libcxx
          - musl-libstdcxx
          - musl-libcxx
          - llvm-libc-libcxx
      jobs:
        description: Parallel make jobs passed to build-toolchain.sh
        required: true
        default: "4"
        type: string
      gcc_version:
        description: GCC version
        required: true
        default: "14.2.0"
        type: string
      binutils_version:
        description: Binutils version
        required: true
        default: "2.43"
        type: string
      linux_headers_version:
        description: Linux headers version
        required: true
        default: "6.6.58"
        type: string
      glibc_version:
        description: glibc version
        required: true
        default: "2.40"
        type: string
      musl_version:
        description: musl version
        required: true
        default: "1.2.5"
        type: string
      llvm_project_version:
        description: llvm-project version
        required: true
        default: "19.1.7"
        type: string
      run_smoke_tests:
        description: Run compile and qemu runtime smoke tests after a successful build
        required: true
        default: true
        type: boolean

concurrency:
  group: build-toolchain-${{ github.ref }}-${{ inputs.combo }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.combo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          mapfile -t packages < <(awk -F'|' '
            NF && $1 !~ /^#/ && $2 != "" { seen[$2] = 1 }
            END {
              for (package in seen) {
                print package
              }
            }
          ' config/ubuntu-24.04-deps.txt | sort)

          if [[ "${{ inputs.run_smoke_tests }}" == "true" ]]; then
            packages+=(qemu-user)
          fi

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cache source archives
        uses: actions/cache@v4
        with:
          path: downloads
          key: ${{ runner.os }}-downloads-${{ inputs.gcc_version }}-${{ inputs.binutils_version }}-${{ inputs.linux_headers_version }}-${{ inputs.glibc_version }}-${{ inputs.musl_version }}-${{ inputs.llvm_project_version }}
          restore-keys: |
            ${{ runner.os }}-downloads-

      - name: Resolve selected combo
        id: combo
        run: |
          set -euo pipefail

          build_name_cxx_runtime_tag() {
            case "$1" in
              libc++)
                printf 'libcxx'
                ;;
              libstdc++)
                printf 'libstdcxx'
                ;;
              *)
                printf '%s' "$1"
                ;;
            esac
          }

          resolve_build_name() {
            local target_triple="$1"
            local libc_variant="$2"
            local cxx_runtime="$3"
            local cxx_runtime_tag

            cxx_runtime_tag="$(build_name_cxx_runtime_tag "${cxx_runtime}")"
            printf '%s' "${target_triple}-${libc_variant}-${cxx_runtime_tag}-gcc-${{ inputs.gcc_version }}-binutils-${{ inputs.binutils_version }}-linux-${{ inputs.linux_headers_version }}" |
              tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-'
          }

          requires_glibc_donor=false
          donor_libc_variant=
          donor_cxx_runtime=
          donor_build_name=
          case "${{ inputs.combo }}" in
            glibc-libstdcxx)
              target_triple="arm-linux-gnueabihf"
              libc_variant="glibc"
              cxx_runtime="libstdc++"
              ;;
            glibc-libcxx)
              target_triple="arm-linux-gnueabihf"
              libc_variant="glibc"
              cxx_runtime="libc++"
              ;;
            musl-libstdcxx)
              target_triple="arm-linux-musleabihf"
              libc_variant="musl"
              cxx_runtime="libstdc++"
              ;;
            musl-libcxx)
              target_triple="arm-linux-musleabihf"
              libc_variant="musl"
              cxx_runtime="libc++"
              ;;
            llvm-libc-libcxx)
              target_triple="arm-linux-gnueabihf"
              libc_variant="llvm-libc"
              cxx_runtime="libc++"
              requires_glibc_donor=true
              donor_libc_variant="glibc"
              donor_cxx_runtime="libstdc++"
              ;;
            *)
              echo "Unsupported combo: ${{ inputs.combo }}" >&2
              exit 1
              ;;
          esac

          build_name="$(resolve_build_name "${target_triple}" "${libc_variant}" "${cxx_runtime}")"
          if [[ "${requires_glibc_donor}" == "true" ]]; then
            donor_build_name="$(resolve_build_name "arm-linux-gnueabihf" "${donor_libc_variant}" "${donor_cxx_runtime}")"
          fi

          {
            echo "target_triple=${target_triple}"
            echo "libc_variant=${libc_variant}"
            echo "cxx_runtime=${cxx_runtime}"
            echo "build_name=${build_name}"
            echo "manifest_path=artifacts/${build_name}.manifest"
            echo "archive_path=artifacts/${build_name}.tar.xz"
            echo "requires_glibc_donor=${requires_glibc_donor}"
            echo "donor_libc_variant=${donor_libc_variant}"
            echo "donor_cxx_runtime=${donor_cxx_runtime}"
            echo "donor_build_name=${donor_build_name}"
            echo "artifact_label=${{ inputs.combo }}-gcc-${{ inputs.gcc_version }}"
          } >>"${GITHUB_OUTPUT}"

      - name: Bootstrap glibc donor toolchain
        if: ${{ steps.combo.outputs.requires_glibc_donor == 'true' }}
        run: |
          set -euo pipefail
          bash ./build-toolchain.sh \
            --libc "${{ steps.combo.outputs.donor_libc_variant }}" \
            --cxx-runtime "${{ steps.combo.outputs.donor_cxx_runtime }}" \
            --jobs "${{ inputs.jobs }}" \
            --gcc-version "${{ inputs.gcc_version }}" \
            --binutils-version "${{ inputs.binutils_version }}" \
            --linux-headers-version "${{ inputs.linux_headers_version }}" \
            --glibc-version "${{ inputs.glibc_version }}" \
            --musl-version "${{ inputs.musl_version }}" \
            --llvm-project-version "${{ inputs.llvm_project_version }}"

          rm -f \
            "artifacts/${{ steps.combo.outputs.donor_build_name }}.manifest" \
            "artifacts/${{ steps.combo.outputs.donor_build_name }}.tar.xz"

      - name: Build selected toolchain
        run: |
          set -euo pipefail
          bash ./build-toolchain.sh \
            --libc "${{ steps.combo.outputs.libc_variant }}" \
            --cxx-runtime "${{ steps.combo.outputs.cxx_runtime }}" \
            --jobs "${{ inputs.jobs }}" \
            --gcc-version "${{ inputs.gcc_version }}" \
            --binutils-version "${{ inputs.binutils_version }}" \
            --linux-headers-version "${{ inputs.linux_headers_version }}" \
            --glibc-version "${{ inputs.glibc_version }}" \
            --musl-version "${{ inputs.musl_version }}" \
            --llvm-project-version "${{ inputs.llvm_project_version }}"

      - name: Resolve build outputs
        id: outputs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          manifest_path="${{ steps.combo.outputs.manifest_path }}"
          if [[ ! -f "${manifest_path}" ]]; then
            exit 0
          fi

          # shellcheck disable=SC1090
          source "${manifest_path}"

          workspace_root="${GITHUB_WORKSPACE:-$PWD}"
          prefix_dir="${workspace_root}/install/${BUILD_NAME}"
          sysroot_dir="${prefix_dir}/${TARGET_TRIPLE}/sysroot"

          [[ -d "${prefix_dir}/bin" ]] || {
            echo "resolved toolchain prefix missing: ${prefix_dir}" >&2
            exit 1
          }
          [[ -d "${sysroot_dir}" ]] || {
            echo "resolved sysroot missing: ${sysroot_dir}" >&2
            exit 1
          }

          {
            echo "manifest_path=${manifest_path}"
            echo "build_name=${BUILD_NAME}"
            echo "prefix_dir=${prefix_dir}"
            echo "sysroot_dir=${sysroot_dir}"
          } >>"${GITHUB_OUTPUT}"

      - name: Run smoke tests
        if: ${{ success() && inputs.run_smoke_tests && steps.outputs.outputs.build_name != '' }}
        run: |
          set -euo pipefail
          RUN_RUNTIME_SMOKE=1 bash ./tests/smoke.sh \
            "${{ steps.outputs.outputs.prefix_dir }}" \
            "${{ steps.outputs.outputs.sysroot_dir }}"

      - name: Publish workflow summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "## Cross toolchain build"
            echo
            echo "- Combo: ${{ inputs.combo }}"
            echo "- Jobs: ${{ inputs.jobs }}"
            echo "- GCC: ${{ inputs.gcc_version }}"
            echo "- Binutils: ${{ inputs.binutils_version }}"
            echo "- Linux headers: ${{ inputs.linux_headers_version }}"
            echo "- glibc: ${{ inputs.glibc_version }}"
            echo "- musl: ${{ inputs.musl_version }}"
            echo "- llvm-project: ${{ inputs.llvm_project_version }}"
            if [[ "${{ steps.combo.outputs.requires_glibc_donor }}" == "true" ]]; then
              echo "- Bootstrap donor: glibc + libstdc++"
            fi
            if [[ -n "${{ steps.outputs.outputs.build_name }}" ]]; then
              echo "- Build name: ${{ steps.outputs.outputs.build_name }}"
            fi
            if [[ -f "${{ steps.combo.outputs.archive_path }}" ]]; then
              echo
              echo "### Archive"
              echo "- $(basename "${{ steps.combo.outputs.archive_path }}")"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload packaged toolchain
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.combo.outputs.artifact_label }}
          path: |
            ${{ steps.combo.outputs.archive_path }}
            ${{ steps.combo.outputs.manifest_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.combo.outputs.artifact_label }}-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14